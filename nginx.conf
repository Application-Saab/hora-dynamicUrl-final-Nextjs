        try_files /admin_new/dashboard/add-photography-product.html =404;
    }

    location = /dashboard/edit-photography-product {
        try_files /admin_new/dashboard/edit-photography-product.html =404;
    }

    location = /dashboard/supplier-details {
        try_files /admin_new/dashboard/supplier-details.html =404;
