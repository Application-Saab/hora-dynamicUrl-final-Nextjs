server {
    server_name horaservices.com;

    client_max_body_size 900M;

    # Keep this because admin_new and required static assets
    # are still served from public_html.
    root /home/horaservices.com/public_html;


    # =========================================================
    # SOCKET.IO / BACKEND SERVICES
    # =========================================================
    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:4000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_ssl_verify off;
    }


    # =========================================================
    # FACE API
    # =========================================================
    location /face-api/ {
        proxy_pass http://127.0.0.1:8000/;

        proxy_buffering off;
        chunked_transfer_encoding on;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }


    # =========================================================
    # MAIN API
    # =========================================================
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_ssl_verify off;
    }


    # =========================================================
    # SMART INVITE
    # =========================================================
    location ^~ /smartinvite/ {
        proxy_pass http://127.0.0.1:4000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_ssl_verify off;
    }


    # =========================================================
    # EVENT CAPSULE
    # =========================================================
    location ^~ /eventcapsule/ {
        proxy_pass http://127.0.0.1:4000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_ssl_verify off;
    }


    # =========================================================
    # MEDIA API
    # =========================================================
    location ^~ /media-api/ {
        proxy_pass http://127.0.0.1:5000/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_ssl_verify off;
    }


    # =========================================================
    # BACKGROUND REMOVER
    # =========================================================
    location /bg-remove/ {
        proxy_pass http://127.0.0.1:7000/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }


    # =========================================================
    # DEFAULT NGINX CONFIG
    # =========================================================
    include /etc/nginx/default.d/*.conf;


    # =========================================================
    # STATIC FILES STILL REQUIRED
    # =========================================================
    # Website favicon/logo
    location = /new_logo_light.png {
        try_files $uri =404;
        access_log off;
    }


    # Service Worker
    location = /sw.js {
        root /home/horaservices.com/public_html;
        default_type application/javascript;
        allow all;
    }


    # Firebase Messaging Service Worker
    location = /firebase-messaging-sw.js {
        root /home/horaservices.com/public_html;
        default_type application/javascript;
        allow all;
    }


    # PWA Manifest
    location = /manifest.json {
        root /home/horaservices.com/public_html;
        default_type application/manifest+json;
        add_header Content-Type "application/manifest+json";
        expires 1d;
    }


    # =========================================================
    # ADMIN PANEL
    # =========================================================
    location = /admin_new/dashboard {
        try_files /admin_new/index.html =404;
    }

    location = /dashboard {
