    location = /dashboard/users-details {
        try_files /admin_new/dashboard/users-details.html =404;
    }

    location = /dashboard/decoration-actual-photo {
        try_files /admin_new/dashboard/decoration-actual-photo.html =404;
    }


    # =========================================================
    # OTHER ADMIN PANEL
    # =========================================================
    location ~ ^/admin_test(?:/)?$ {
        try_files /admin_test/index.html /index.html;
    }


    # =========================================================
    # API UPLOADS
    # =========================================================
    # Keep existing direct access to uploaded files.
    # This is intentionally before the Next.js catch-all.
    location ^~ /api/uploads/ {
        allow all;
    }


    # =========================================================
    # NEXT.JS STATIC ASSETS
    # =========================================================
    # Dashboard/Admin assets
    #
    # Dashboard pages are physically served from:
    # /home/horaservices.com/public_html/admin_new/
    #
    # Their HTML still references:
    # /_next/static/...
    #
    # Those assets belong to the old Admin build and must come
    # from:
    # /home/horaservices.com/public_html/_next/
    #
    # Normal website/SSR pages also use:
    # /_next/static/...
    #
    # Those assets must go to the SSR Next.js server on port 4700.
    #
    # We distinguish them using the Referer header.
    # =========================================================
    # NEXT.JS STATIC ASSETS
    # =========================================================
    location ^~ /_next/ {

        # =====================================================
        # ADMIN / DASHBOARD ASSETS
        # =====================================================
        #
        # These pages are served from public_html/admin_new
        # and therefore their _next assets must also come from
        # public_html/_next.
        #
        # Supported admin page referers:
        #
        # /dashboard/*
        # /dashboard-login
        # /admin_new/*
        #

        if ($http_referer ~* "^https://horaservices\.com/(dashboard|dashboard-login|admin_new)(/|$)") {
            rewrite ^/_next/(.*)$ /__admin_next/$1 last;
        }


        # =====================================================
        # NORMAL SSR ASSETS
        # =====================================================
        proxy_pass http://127.0.0.1:4700;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }


    # =========================================================
    # ADMIN _NEXT STATIC ASSETS
    # =========================================================
    location ^~ /__admin_next/ {

        alias /home/horaservices.com/public_html/_next/;

        access_log off;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # =========================================================
    # NEXT.JS SSR CATCH-ALL
    # =========================================================

    # ALL normal website routes go to Next.js SSR.
    #
    # Examples:
    # /
    # /aboutus
    # /contactus
    # /balloon-decoration
    # /indore/balloon-decoration
    # /wonderland/...
    # /templates
    # /venue-list
    # /chat
    # etc.
    #
    # All are now handled by Next.js.
    #
    location / {
        proxy_pass http://127.0.0.1:4700;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }


    # =========================================================
    # NGINX ERROR PAGE
    # =========================================================
    # Do NOT use:
    # error_page 404 /404.html;
    #
    # because Next.js should handle its own 404 page.
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
    }


    # =========================================================
    # SSL
    # =========================================================
    listen 443 ssl;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    ssl_certificate /etc/letsencrypt/live/horaservices.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/horaservices.com/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}


# =============================================================
# WWW HTTPS -> NON-WWW
# =============================================================
server {
    listen 443 ssl http2;

    server_name www.horaservices.com;

    ssl_certificate /etc/letsencrypt/live/horaservices.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/horaservices.com/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://horaservices.com$request_uri;
}


# =============================================================
# WWW HTTP -> HTTPS NON-WWW
# =============================================================
server {
    listen 80;

    server_name www.horaservices.com;

    return 301 https://horaservices.com$request_uri;
}


# =============================================================
# NON-WWW HTTP -> HTTPS
# =============================================================
server {
    listen 80;

    server_name horaservices.com;

    return 301 https://horaservices.com$request_uri;
}